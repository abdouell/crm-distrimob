# /etc/nginx/sites-available/crm-pyramidev
# Le CRM est un monolithe : Spring Boot sert la SPA Angular ET l'API sur 8080.
# Pas de root/try_files ici — le fallback SPA est gere par SpaWebController cote Java.
server {
    listen 80;
    server_name crm.distrimob.fr;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
    }
}
